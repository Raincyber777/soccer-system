# 绿茵汇前端站点 nginx 配置（SPA history 路由）
# 裸 nginx：把 root 改成你的前端目录，复制到 /etc/nginx/conf.d/soccer.conf，然后 nginx -s reload
# 宝塔面板：网站 → 站点设置 → 配置文件，确保 root 指向前端目录、且 location / 里有 try_files 那一行
server {
    listen 8083;                            # 绿茵汇前端端口（80/8000/8081/8082/8443 已被其他项目占用；记得阿里云安全组放行 8083）
    server_name _;                          # 有域名就填域名，没有保持 _
    root /www/wwwroot/soccer-system;        # 前端目录 = deploy.ps1 里的 $DestDir
    index index.html;

    # 关键：前端 history 路由刷新回退，/user/dashboard 等深链接刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
