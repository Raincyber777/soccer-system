<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 绿茵汇 favicon：镂空背景只留球体主体；大色块粗形状保证 16px 清晰 -->
  <!-- 动画由 src/utils/animatedFavicon.ts 用 canvas 逐帧旋转驱动（全浏览器生效），SVG 保持静态原稿 -->
  <defs>
    <clipPath id="ball-clip"><circle cx="32" cy="32" r="24"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="24" fill="#ffffff" stroke="#0f3d24" stroke-width="4"/>

  <!-- 足球贴皮：中央五边形 + 5 条延伸到球缘的缝线 -->
  <g clip-path="url(#ball-clip)" fill="#0f3d24" stroke="#0f3d24">
    <path d="M32 23 40.56 29.22 37.29 39.28 26.71 39.28 23.44 29.22Z" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M32 23 32 5"/>
      <path d="M40.56 29.22 57.68 23.66"/>
      <path d="M37.29 39.28 47.87 53.84"/>
      <path d="M26.71 39.28 16.13 53.84"/>
      <path d="M23.44 29.22 6.32 23.66"/>
    </g>
  </g>
</svg>
